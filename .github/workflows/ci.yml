name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Typecheck & Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install backend dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.3.0,<9.0.0" "ruff>=0.8.0,<1.0.0" "mypy>=1.13.0,<2.0.0"

      - name: Run Ruff lint checks
        run: ruff check app tests ../infrastructure/database/migrations

      - name: Run Mypy strict type checks
        run: >
          mypy app tests
          ../infrastructure/database/migrations/env.py
          ../infrastructure/database/migrations/versions/*.py

      - name: Run isolated backend test suite
        run: pytest -v

  frontend:
    name: Frontend (Typecheck, Lint, Format & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typegen and typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Build production bundle
        run: npm run build
